<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ARKit & ARCore Web Viewer</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f1015;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
    }

    /* Barra superiore informativa */
    .top-panel {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .status-pill {
      background: rgba(20, 20, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      backdrop-filter: blur(8px);
    }
    .status-pill span { color: #38bdf8; font-weight: bold; }

    /* Pulsante AR ben visibile in basso */
    #custom-ar-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
    }
    #custom-ar-button:active {
      transform: translateX(-50%) scale(0.96);
    }

    /* Messaggio di errore o diagnostica */
    #diag-msg {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(220, 38, 38, 0.9);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      display: none;
      z-index: 100;
      text-align: center;
      max-width: 90%;
    }
  </style>
</head>
<body>

  <div class="top-panel">
    <div class="status-pill">
      Dispositivo: <span id="arSupportText">Verifica AR...</span>
    </div>
  </div>

  <div id="diag-msg"></div>

  <!-- 
    Modello di prova ufficiale con supporto sia per GLB (Android/PC) sia per USDZ (Apple ARKit nativo)
  -->
  <model-viewer id="viewer"
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
    ios-src="https://modelviewer.dev/shared-assets/models/Astronaut.usdz"
    alt="Modello 3D con ARKit"
    ar
    ar-modes="quick-look scene-viewer webxr"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1.5"
    auto-rotate>

    <button slot="ar-button" id="custom-ar-button">
      📸 Apri Fotocamera (AR)
    </button>

  </model-viewer>

  <script>
    var viewer = document.getElementById('viewer');
    var statusText = document.getElementById('arSupportText');
    var diagMsg = document.getElementById('diag-msg');

    // Verifica se il browser/dispositivo è pronto per AR
    viewer.addEventListener('load', function() {
      if (viewer.canActivateAR) {
        statusText.innerText = 'Pronto per ARKit / ARCore ✅';
        statusText.style.color = '#4ade80';
      } else {
        statusText.innerText = 'AR non supportata o disattivata ⚠️';
        statusText.style.color = '#f87171';
      }
    });

    // Se l'avvio AR fallisce, mostra a schermo il motivo esatto
    viewer.addEventListener('ar-status', function(event) {
      if (event.detail.status === 'failed') {
        diagMsg.style.display = 'block';
        diagMsg.innerText = 'Impossibile avviare la fotocamera. Controlla i permessi di Safari o carica un file con URL pubblico.';
      }
    });
  </script>

</body>
</html>
